{% extends "music/base.html" %}

{% block content %}
<main>
    <h1>хонисаклер</h1>

    {% if album %}
        <h2>{{ album.title }}</h2>
        <p>{{ album.release_year }}</p>

        <ul>
            {% for track in album.tracks.all %}
                <li>
                    {{ track.number }}. {{ track.title }} — {{ track.duration }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}
</main>
{% endblock %}
